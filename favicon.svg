<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zetaropy Z-E monogram with cat ears">
    <rect width="64" height="64" rx="13" fill="#f7f3eb"/>
    <!-- ears: Zeta's black, Entropy's gray -->
    <polygon points="16,20 18,5 28,19" fill="#33383d"/>
    <polygon points="48,20 46,5 36,19" fill="#8494a2"/>
    <g fill="#456079">
        <!-- top bar -->
        <rect x="13" y="20" width="36" height="8"/>
        <!-- shallow diagonal: right end joins top bar, left end joins bottom bar -->
        <polygon points="13,41 49,28 49,36 13,49"/>
        <!-- bottom bar -->
        <rect x="13" y="49" width="36" height="8"/>
    </g>
</svg>
