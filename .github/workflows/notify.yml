name: Notify readers of journal entries

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
  workflow_dispatch:
    inputs:
      post:
        description: "Post file to announce (e.g. 2026-08-17-nobody-is-under-the-rug)"
        required: true
      kind:
        description: "Is this a new or an updated entry?"
        type: choice
        options: [new, updated]
        default: new
      dry_run:
        description: "Print the email instead of sending it"
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Announce changed posts
        env:
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_API_BASE: ${{ secrets.MAILGUN_API_BASE }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_RECIPIENTS: ${{ secrets.MAIL_RECIPIENTS }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 .github/scripts/notify_posts.py \
              --post "${{ inputs.post }}" \
              --kind "${{ inputs.kind }}" \
              ${{ inputs.dry_run && '--dry-run' || '' }}
          else
            python3 .github/scripts/notify_posts.py \
              --base "${{ github.event.before }}" \
              --head "${{ github.sha }}"
          fi
